<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <meta name="theme-color" content="#111827" />
  <title>手機排班工具 v4.1</title>
  <style>
    :root{--bg:#f5f5f4;--card:#fff;--text:#1c1917;--muted:#78716c;--line:#e7e5e4;--dark:#111827;--warn-bg:#fffbeb;--warn:#92400e;--ok-bg:#ecfdf5;--ok:#065f46;--danger:#b91c1c}
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}.app{width:min(100%,560px);margin:0 auto;padding:16px 14px 104px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:0 8px 20px rgba(15,23,42,.05)}.hero{padding:20px}.card{padding:14px;margin:10px 0}.eyebrow{color:var(--muted);font-size:13px;margin:0 0 4px}h1{margin:0;font-size:26px;line-height:1.2;letter-spacing:-.02em}h2{font-size:18px;margin:22px 4px 10px}.desc{color:var(--muted);font-size:14px;margin:10px 0 0;line-height:1.55}.share-note{color:var(--muted);font-size:12px;margin-top:8px;line-height:1.45}.week-box{margin-top:16px;padding:12px;border-radius:18px;background:#fafaf9;border:1px solid var(--line)}.week-title{font-weight:700;margin-bottom:10px}.week-controls{display:grid;grid-template-columns:42px 1fr 42px;gap:8px}.add-grid{display:grid;grid-template-columns:104px 1fr;gap:8px}input,select,button{font:inherit;border-radius:14px}input,select{width:100%;border:1px solid var(--line);background:#fff;padding:11px 12px;min-height:44px;outline:none}button{min-height:44px;border:0;padding:10px 14px;font-weight:700;background:var(--dark);color:#fff;cursor:pointer}button.secondary{background:#e7e5e4;color:#292524}button.danger{background:#fee2e2;color:#991b1b}.full{width:100%;margin-top:8px}.person-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.person-name{font-weight:800;font-size:17px}.small{color:var(--muted);font-size:12px;margin-top:2px}.small.over-off{color:var(--danger);font-weight:800}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;background:#f5f5f4;color:var(--muted);font-size:12px;margin-left:6px}.days{margin-top:12px;display:grid;gap:8px}.day-row{display:grid;grid-template-columns:82px 1fr;align-items:center;gap:8px;background:#fafaf9;border:1px solid #f0efee;padding:8px;border-radius:16px}.day-label{font-size:13px;font-weight:700}.date{display:block;color:var(--muted);font-size:11px;font-weight:500}.stats-card{position:sticky;top:0;z-index:18;margin:10px -2px 14px;border-radius:0 0 24px 24px;box-shadow:0 10px 24px rgba(15,23,42,.13);border-top:0;background:rgba(255,255,255,.96);backdrop-filter:blur(12px)}.stats-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.stats-title{font-weight:900;font-size:17px}.stats-sub{color:var(--muted);font-size:11px;white-space:nowrap}.stats-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.stat{background:#fafaf9;border:1px solid var(--line);border-radius:14px;padding:8px 2px;text-align:center;font-size:11px}.stat b{display:block;font-size:13px}.stat .work{color:#065f46;font-weight:700}.stat .off{color:#991b1b;font-weight:700}.notice{margin-top:10px;padding:10px 12px;border-radius:16px;font-size:12px;line-height:1.45;max-height:84px;overflow:auto}.notice.warn{background:var(--warn-bg);color:var(--warn)}.notice.ok{background:var(--ok-bg);color:var(--ok)}.sticky{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(100% - 28px,532px);display:grid;grid-template-columns:.9fr 1fr 1.15fr;gap:8px;z-index:20}.sticky button{min-height:54px;padding:8px;box-shadow:0 12px 24px rgba(15,23,42,.18);font-size:14px}
  </style>
</head>
<body>
  <main class="app">
    <section class="hero"><p class="eyebrow">手機排班工具 v4.1</p><h1>下週班表</h1><p class="desc">每次開啟會自動帶入下一週一到週日。排班選項固定只保留：上班、休假、上休、下休。</p><div class="week-box"><div class="week-title" id="weekTitle">班表日期</div><div class="week-controls"><button class="secondary" id="prevWeek">‹</button><input type="date" id="weekStart"/><button class="secondary" id="nextWeek">›</button></div><button class="secondary full" id="defaultWeek">回到下一週班表</button></div></section>
    <section class="card stats-card"><div class="stats-head"><div class="stats-title">每日人力檢查</div><div class="stats-sub">排班時即時更新</div></div><div class="stats-grid" id="statsGrid" style="margin-top:10px"></div><div id="warnings"></div></section>
    <section class="card"><div class="person-name">新增人員</div><div class="add-grid" style="margin-top:10px"><select id="newGroup"><option value="櫃檯">櫃檯</option><option value="銷售">銷售</option><option value="專員">專員</option></select><input id="newName" placeholder="輸入姓名"/></div><button class="full" id="addStaff">加入班表</button><div class="share-note">每人每週標準休假為 2 天；超過 2 天時，個人休假提示會自動變紅。</div></section>
    <section id="staffSections"></section>
  </main>
  <div class="sticky"><button class="secondary" id="resetSchedule">重排</button><button id="copySchedule">複製文字</button><button id="exportImage">輸出圖片</button></div>
<script>
const weekdayLabels=["一","二","三","四","五","六","日"],shiftOptions=["上班","休假","上休","下休"],groups=["櫃檯","銷售","專員"],STANDARD_OFF_LIMIT=2,storageKey="mobile-shift-scheduler-v4";
const oldStorageKeys=["mobile-shift-scheduler-v3","mobile-shift-scheduler-v2","mobile-shift-scheduler-v1"];
const defaultStaff=[{id:"counter-1",group:"櫃檯",name:"王柏勳"},{id:"specialist-1",group:"專員",name:"曾琛苡"},{id:"specialist-2",group:"專員",name:"石嫚倪"},{id:"specialist-3",group:"專員",name:"黃韻蓁"},{id:"specialist-4",group:"專員",name:"鄭詩怡"},{id:"specialist-5",group:"專員",name:"鄭毓柔"},{id:"specialist-6",group:"專員",name:"黃素月"},{id:"specialist-7",group:"專員",name:"高圓媛"},{id:"specialist-8",group:"專員",name:"鄭冠琳"},{id:"specialist-9",group:"專員",name:"宋大喜"},{id:"specialist-10",group:"專員",name:"陳金燕"}];
let state=loadState();
function getNextMonday(base=new Date()){const d=new Date(base),day=d.getDay(),diff=day===0?1:8-day;d.setDate(d.getDate()+diff);d.setHours(0,0,0,0);return d}
function toInputDate(date){const d=new Date(date);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
function formatDate(date){const d=new Date(date);return `${d.getMonth()+1}/${d.getDate()}`}
function buildWeek(startDate){return Array.from({length:7},(_,i)=>{const d=new Date(startDate);d.setDate(d.getDate()+i);return d})}
function cleanShift(value){if(value==="休")return "休假";if(["早","晚","早多","晚多"].includes(value))return "上班";return shiftOptions.includes(value)?value:"上班"}
function isWorkingShift(value){return cleanShift(value)!=="休假"}
function createSchedule(staff){const s={};staff.forEach(p=>s[p.id]=Array(7).fill("上班"));return s}
function activeGroups(){return groups.filter(g=>state.staff.some(p=>p.group===g))}
function loadState(){const defaultWeek=toInputDate(getNextMonday());for(const key of [storageKey,...oldStorageKeys]){try{const saved=JSON.parse(localStorage.getItem(key));if(saved&&Array.isArray(saved.staff)&&saved.schedule){const staff=normalizeStaff(saved.staff);return{staff,schedule:ensureSchedule(staff,saved.schedule),weekStart:defaultWeek}}}catch(e){}}return{staff:defaultStaff,schedule:createSchedule(defaultStaff),weekStart:defaultWeek}}
function normalizeStaff(staff){return staff.map(p=>{const group=p.name==="王柏勳"?"櫃檯":(p.group==="櫃台"?"櫃檯":(groups.includes(p.group)?p.group:"專員"));return{...p,group,weeklyOffLimit:STANDARD_OFF_LIMIT}})}
function ensureSchedule(staff,schedule){const next={...schedule};staff.forEach(p=>{if(!Array.isArray(next[p.id]))next[p.id]=Array(7).fill("上班");next[p.id]=next[p.id].slice(0,7).map(cleanShift);while(next[p.id].length<7)next[p.id].push("上班")});Object.keys(next).forEach(id=>{if(!staff.some(p=>p.id===id))delete next[id]});return next}
function saveState(){state.schedule=ensureSchedule(state.staff,state.schedule);localStorage.setItem(storageKey,JSON.stringify({staff:state.staff,schedule:state.schedule,updatedAt:new Date().toISOString()}))}
function offCountFor(person){return(state.schedule[person.id]||[]).filter(v=>cleanShift(v)==="休假").length}
function render(){const weekStart=new Date(state.weekStart+"T00:00:00"),weekDates=buildWeek(weekStart);document.getElementById("weekStart").value=state.weekStart;document.getElementById("weekTitle").textContent=`${formatDate(weekDates[0])} - ${formatDate(weekDates[6])}`;const root=document.getElementById("staffSections");root.innerHTML="";activeGroups().forEach(group=>{const title=document.createElement("h2");title.textContent=group;root.appendChild(title);state.staff.filter(p=>p.group===group).forEach(p=>root.appendChild(renderPersonCard(p,weekDates)))});renderStats();saveState()}
function renderPersonCard(person,weekDates){const card=document.createElement("div");card.className="card";const offCount=offCountFor(person),offClass=offCount>STANDARD_OFF_LIMIT?"small over-off":"small";card.innerHTML=`<div class="person-head"><div><div class="person-name">${escapeHtml(person.name)}<span class="pill">${person.group}</span></div><div class="${offClass}">本週休 ${offCount} / ${STANDARD_OFF_LIMIT} 天</div></div><button class="danger" data-remove="${person.id}">刪除</button></div><div class="days"></div>`;const days=card.querySelector(".days");weekdayLabels.forEach((label,i)=>{const row=document.createElement("div");row.className="day-row";const current=cleanShift(state.schedule[person.id]?.[i]||"上班");row.innerHTML=`<div class="day-label">週${label}<span class="date">${formatDate(weekDates[i])}</span></div><select data-person="${person.id}" data-day="${i}">${shiftOptions.map(o=>`<option value="${o}" ${o===current?"selected":""}>${o}</option>`).join("")}</select>`;days.appendChild(row)});return card}
function renderStats(){const statsGrid=document.getElementById("statsGrid"),warningsBox=document.getElementById("warnings");statsGrid.innerHTML="";warningsBox.innerHTML="";const warnings=[];weekdayLabels.forEach((label,i)=>{const off=state.staff.filter(p=>cleanShift(state.schedule[p.id]?.[i])==="休假").length,working=state.staff.length-off;const div=document.createElement("div");div.className="stat";div.innerHTML=`<b>${label}</b><span class="work">上 ${working}</span><br><span class="off">休 ${off}</span>`;statsGrid.appendChild(div);activeGroups().forEach(group=>{const workingByGroup=state.staff.filter(p=>p.group===group&&isWorkingShift(state.schedule[p.id]?.[i])).length;const min=group==="櫃檯"?1:2;if(workingByGroup<min)warnings.push(`週${label} ${group}上班人數少於 ${min} 人`)})});state.staff.forEach(p=>{const offCount=offCountFor(p);if(offCount>STANDARD_OFF_LIMIT)warnings.push(`${p.name} 本週休 ${offCount} 天，超過標準 ${STANDARD_OFF_LIMIT} 天`)});const notice=document.createElement("div");notice.className=warnings.length?"notice warn":"notice ok";notice.innerHTML=warnings.length?warnings.map(w=>`• ${escapeHtml(w)}`).join("<br>"):"目前沒有明顯排班衝突。";warningsBox.appendChild(notice)}
function escapeHtml(v){return String(v).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function addStaff(){const nameInput=document.getElementById("newName"),group=document.getElementById("newGroup").value,name=nameInput.value.trim();if(!name)return;const person={id:`${group}-${Date.now()}`,group,name,weeklyOffLimit:STANDARD_OFF_LIMIT};state.staff.push(person);state.schedule[person.id]=Array(7).fill("上班");nameInput.value="";render()}
function removeStaff(id){state.staff=state.staff.filter(p=>p.id!==id);delete state.schedule[id];render()}
function changeWeek(days){const d=new Date(state.weekStart+"T00:00:00");d.setDate(d.getDate()+days);state.weekStart=toInputDate(d);render()}
function resetSchedule(){state.schedule=createSchedule(state.staff);render()}
function flashButton(id,activeText,defaultText){const btn=document.getElementById(id);btn.textContent=activeText;setTimeout(()=>btn.textContent=defaultText,1600)}
function copySchedule(){const weekDates=buildWeek(new Date(state.weekStart+"T00:00:00"));const lines=[`下週班表｜${formatDate(weekDates[0])}-${formatDate(weekDates[6])}`,""];activeGroups().forEach(group=>{lines.push(`【${group}】`);state.staff.filter(p=>p.group===group).forEach(p=>{const cells=weekdayLabels.map((label,i)=>`週${label}:${cleanShift(state.schedule[p.id]?.[i]||"上班")}`);lines.push(`${p.name}｜${cells.join("｜")}`)});lines.push("")});const text=lines.join("\n");navigator.clipboard.writeText(text).then(()=>flashButton("copySchedule","已複製","複製文字")).catch(()=>alert(text))}
function makeScheduleCanvas(){const scale=2,margin=42,titleH=92,colNameW=120,colW=76,headerH=48,groupH=38,rowH=46,tableW=colNameW+colW*7;const rows=[];activeGroups().forEach(group=>{rows.push({type:"group",group});state.staff.filter(p=>p.group===group).forEach(person=>rows.push({type:"person",person}))});const tableH=headerH+rows.reduce((sum,row)=>sum+(row.type==="group"?groupH:rowH),0),footerH=46;const canvas=document.createElement("canvas");canvas.width=(tableW+margin*2)*scale;canvas.height=(titleH+tableH+footerH+margin*2)*scale;const ctx=canvas.getContext("2d");ctx.scale(scale,scale);const x0=margin;let y=margin;const weekDates=buildWeek(new Date(state.weekStart+"T00:00:00"));ctx.fillStyle="#f8fafc";ctx.fillRect(0,0,canvas.width/scale,canvas.height/scale);ctx.fillStyle="#111827";ctx.font="700 30px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif";ctx.fillText("下週班表",x0,y+32);ctx.font="500 17px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif";ctx.fillStyle="#57534e";ctx.fillText(`${formatDate(weekDates[0])} - ${formatDate(weekDates[6])}`,x0,y+62);y+=titleH;roundedRect(ctx,x0,y,tableW,tableH,18,"#ffffff","#d6d3d1");let ty=y;ctx.fillStyle="#111827";ctx.fillRect(x0,ty,tableW,headerH);ctx.fillStyle="#fff";ctx.font="700 15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif";centerText(ctx,"人員",x0,ty,colNameW,headerH);weekdayLabels.forEach((label,i)=>{const cx=x0+colNameW+i*colW;centerText(ctx,`週${label}`,cx,ty+7,colW,20);ctx.font="500 11px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif";centerText(ctx,formatDate(weekDates[i]),cx,ty+27,colW,16);ctx.font="700 15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"});ty+=headerH;rows.forEach(row=>{if(row.type==="group"){ctx.fillStyle="#f5f5f4";ctx.fillRect(x0,ty,tableW,groupH);ctx.fillStyle="#1c1917";ctx.font="700 16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif";ctx.fillText(row.group,x0+14,ty+24);drawLine(ctx,x0,ty+groupH,x0+tableW,ty+groupH,"#e7e5e4");ty+=groupH;return}const p=row.person;ctx.fillStyle="#fff";ctx.fillRect(x0,ty,tableW,rowH);ctx.fillStyle="#1c1917";ctx.font="700 15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif";centerText(ctx,p.name,x0,ty,colNameW,rowH);weekdayLabels.forEach((_,i)=>{const cx=x0+colNameW+i*colW,value=cleanShift(state.schedule[p.id]?.[i]||"上班");ctx.fillStyle=value==="休假"?"#991b1b":"#1c1917";ctx.font="700 15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif";centerText(ctx,value,cx,ty,colW,rowH)});for(let i=0;i<=7;i++)drawLine(ctx,x0+colNameW+i*colW,ty,x0+colNameW+i*colW,ty+rowH,"#e7e5e4");drawLine(ctx,x0,ty+rowH,x0+tableW,ty+rowH,"#e7e5e4");ty+=rowH});drawLine(ctx,x0+colNameW,y,x0+colNameW,y+tableH,"#d6d3d1");for(let i=0;i<=7;i++)drawLine(ctx,x0+colNameW+i*colW,y,x0+colNameW+i*colW,y+tableH,"#e7e5e4");ctx.fillStyle="#78716c";ctx.font="500 12px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif";ctx.fillText("手機排班工具輸出｜可直接分享至 LINE",x0,y+tableH+30);return canvas}
function roundedRect(ctx,x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke;ctx.stroke()}
function drawLine(ctx,x1,y1,x2,y2,color){ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=1;ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function centerText(ctx,text,x,y,w,h){ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(text,x+w/2,y+h/2);ctx.textAlign="start";ctx.textBaseline="alphabetic"}
async function exportImage(){const canvas=makeScheduleCanvas();const blob=await new Promise(resolve=>canvas.toBlob(resolve,"image/png",1));const weekDates=buildWeek(new Date(state.weekStart+"T00:00:00"));const fileName=`班表_${formatDate(weekDates[0]).replace("/","-")}_${formatDate(weekDates[6]).replace("/","-")}.png`;const file=new File([blob],fileName,{type:"image/png"});if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:"下週班表",text:"下週班表圖片"});flashButton("exportImage","已開啟分享","輸出圖片");return}catch(e){if(e&&e.name==="AbortError")return}}const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=fileName;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);flashButton("exportImage","已下載","輸出圖片")}
document.addEventListener("change",e=>{if(e.target.matches("select[data-person]")){const id=e.target.dataset.person,day=Number(e.target.dataset.day);state.schedule[id][day]=cleanShift(e.target.value);render()}if(e.target.id==="weekStart"){state.weekStart=e.target.value;render()}});
document.addEventListener("click",e=>{const id=e.target.dataset.remove;if(id)removeStaff(id)});
document.getElementById("addStaff").addEventListener("click",addStaff);document.getElementById("newName").addEventListener("keydown",e=>{if(e.key==="Enter")addStaff()});document.getElementById("prevWeek").addEventListener("click",()=>changeWeek(-7));document.getElementById("nextWeek").addEventListener("click",()=>changeWeek(7));document.getElementById("defaultWeek").addEventListener("click",()=>{state.weekStart=toInputDate(getNextMonday());render()});document.getElementById("resetSchedule").addEventListener("click",resetSchedule);document.getElementById("copySchedule").addEventListener("click",copySchedule);document.getElementById("exportImage").addEventListener("click",exportImage);render();
</script>
</body>
</html>
